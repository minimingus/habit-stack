name: Better
options:
  bundleIdPrefix: com.tomerab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 4.0.0
  PostHog:
    url: https://github.com/posthog/posthog-ios
    from: 3.0.0

targets:
  Better:
    type: application
    platform: iOS
    sources:
      - path: Better
    resources:
      - path: Better/Assets.xcassets
      - path: Better/Secrets.plist
        optional: true
    info:
      path: Better/Info.plist
      properties:
        CFBundleName: Better
        CFBundleDisplayName: Better
        CFBundleIdentifier: com.tomerab.better
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - better
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
      - target: BetterWidget
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: FDLSN3ZJFV
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.tomerab.better
        CODE_SIGN_ENTITLEMENTS: Better/Better.entitlements

  BetterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BetterWidget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: BetterWidget/Info.plist
      properties:
        CFBundleDisplayName: Better Widget
        CFBundleIdentifier: com.tomerab.better.widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: FDLSN3ZJFV
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.tomerab.better.widget
        CODE_SIGN_ENTITLEMENTS: BetterWidget/BetterWidget.entitlements

  BetterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetterTests
    dependencies:
      - target: Better
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: FDLSN3ZJFV
